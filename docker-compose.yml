services:
  # Redis Cache & Session Store
  redis:
    image: redis:alpine
    container_name: ketabi_redis
    restart: always
    # Exposing 6379 for internal use; mapping to external port if needed for debugging
    ports:
      - "6379:6379"

  # Backend Node.js API
  backend:
    build:
      context: ./Backend/Ketabi_Website
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME}/ketabi-backend:latest
    container_name: ketabi_backend
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/ketabi?authSource=admin
    depends_on:
      - redis
      - mongodb
    # The API is proxied by Nginx on port 80; but can be exposed on 3000 for direct debugging
    ports:
      - "3000:3000"

  # Frontend Angular SPA + Nginx Reverse Proxy
  frontend:
    build:
      context: ./Frontend/ketabi
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME}/ketabi-frontend:latest
    container_name: ketabi_frontend
    restart: always
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  # MongoDB Database
  mongodb:
    image: mongo:6-jammy
    container_name: ketabi_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rootpassword
      - MONGO_INITDB_DATABASE=ketabi

volumes:
  mongodb_data:
