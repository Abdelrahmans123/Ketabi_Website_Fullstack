<div class="book-card-wrapper">
  <div class="book-card h-100">
    <!-- Book Image -->
    <img [src]="image || 'assets/images/book-placeholder.png'" [alt]="title" class="card-img-top" />

    <!-- Overlay with Actions -->
    <div class="card-overlay">
      <div class="overlay-controls">
        <!-- Add to Cart Button -->
        <button
          class="overlay-link btn-cart"
          title="Add to cart"
          aria-label="Add to cart"
          (click)="addToCart($event)"
        >
          <i class="fa fa-shopping-cart" aria-hidden="true"></i>
        </button>

        <!-- View Details Button -->
        <button
          class="overlay-link btn-details"
          [routerLink]="['/books', id]"
          title="View details"
          aria-label="View details"
        >
          <i class="fa fa-eye" aria-hidden="true"></i>
        </button>
        <button
          class="overlay-link btn-wishlist"
          title="Add to wishlist"
          aria-label="Add to wishlist"
          (click)="addToWishlist($event)"
        >
          @if(isInWishlist) {
          <i class="fa-solid fa-heart text-danger"></i>
          } @else {
          <i class="fa-solid fa-heart"></i>
          }
        </button>
      </div>
    </div>

    <!-- Card Body -->
    <div class="card-body">
      <h6 class="card-title text-truncate">{{ title }}</h6>
      <p class="card-text small text-muted text-truncate">{{ author }}</p>

      <!-- Price and Rating -->
      <div class="card-footer-info" *ngIf="price || rating">
        <div class="price-rating">
          <span class="price" *ngIf="price">
            {{ price | currency : 'EGP' : 'symbol' : '1.0-0' }}
          </span>
          <span class="rating" *ngIf="rating">★ {{ rating }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
