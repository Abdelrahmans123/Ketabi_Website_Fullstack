<aside class="sidebar" [class.collapsed]="sidebarCollapsed">
  <div class="sidebar-header">
    <div class="logo">
      <i class="fas fa-book-reader"></i>
      <span *ngIf="!sidebarCollapsed">Ketabi Admin</span>
    </div>
    <button class="toggle-btn" (click)="toggleSidebar()">
      <i class="fas" [class.fa-bars]="sidebarCollapsed" [class.fa-times]="!sidebarCollapsed"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
    >
      <i [ngClass]="['fas', item.icon]"></i>
      <span *ngIf="!sidebarCollapsed">{{ item.label }}</span>
      <span class="badge" *ngIf="item.badge && !sidebarCollapsed">{{ item.badge }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span *ngIf="!sidebarCollapsed">Logout</span>
    </button>
  </div>
</aside>
